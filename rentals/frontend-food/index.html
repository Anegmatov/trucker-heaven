<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trucker Heaven Food</title><link rel="stylesheet" href="styles.css"><script src="config.js" defer></script><script src="app.js" defer></script></head><body><header><strong>TRUCKER HEAVEN</strong><span>Food · Pay at pickup</span></header><main><section class="hero"><p>Fresh for pickup</p><h1>Order food your way.</h1><small>No account. No card. Pay when you pick up.</small></section><div id="notice" role="alert"></div><section id="menu" aria-live="polite">Loading menu…</section><section class="cart"><h2>Your order</h2><div id="cartItems">Your cart is empty.</div><strong id="cartTotal">$0.00</strong><form id="checkout"><label>Name<input id="customerName" maxlength="160" required></label><label>Phone<input id="customerPhone" maxlength="30" inputmode="tel" required></label><label>Pickup<select id="pickupType"><option value="ASAP">As soon as possible</option><option value="SCHEDULED">Choose a time</option></select></label><label id="pickupAtLabel" hidden>Pickup time<input id="pickupAt" type="datetime-local"></label><label>Special instructions<textarea id="notes" maxlength="1000"></textarea></label><button>Place order · Pay at pickup</button></form></section><section id="confirmation" hidden></section></main></body></html>

name: ParkingOps release gate

on:
  push:
    branches: [parking-management-mvp]
  pull_request:
    branches: [parking-management-mvp]

permissions:
  contents: read
  actions: read

concurrency:
  group: parkingops-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: parkingops_test
          POSTGRES_USER: parkingops_test
          POSTGRES_PASSWORD: localonly
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U parkingops_test -d parkingops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://parkingops_test:localonly@127.0.0.1:55432/parkingops_test
      PARKING_TEST_DATABASE: parkingops_test
      ADMIN_LOGIN_RATE_LIMIT_MAX: 1000
      PUBLIC_BOOKING_RATE_LIMIT_MAX: 1000
      PUBLIC_LOOKUP_RATE_LIMIT_MAX: 1000

    steps:
      - uses: actions/checkout@v4

      - name: Reject committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1 detect
          --source=/repo --config=/repo/.gitleaks.toml
          --no-git --no-banner --redact --timeout=120

      - name: Initialize CodeQL SAST
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Reject high-severity production dependency vulnerabilities
        run: npm audit --prefix backend --omit=dev --audit-level=high

      - name: Apply and replay migrations 001-055
        run: |
          npm run migrate --prefix backend
          npm run migrate --prefix backend
          test "$(docker exec ${{ job.services.postgres.id }} psql -U parkingops_test -d parkingops_test -Atc "select count(*) from schema_migrations")" = "55"
          test "$(docker exec ${{ job.services.postgres.id }} psql -U parkingops_test -d parkingops_test -Atc "select count(*) from schema_migrations where name='047_weekly_parking_pricing.sql'")" = "1"
          test "$(docker exec ${{ job.services.postgres.id }} psql -U parkingops_test -d parkingops_test -Atc "select count(*) from schema_migrations where name='048_demo_payment_bypass.sql'")" = "1"
          test "$(docker exec ${{ job.services.postgres.id }} psql -U parkingops_test -d parkingops_test -Atc "select count(*) from schema_migrations where name='049_open_ended_monthly_parking.sql'")" = "1"
          test "$(docker exec ${{ job.services.postgres.id }} psql -U parkingops_test -d parkingops_test -Atc "select count(*) from schema_migrations where name='050_monthly_rate_and_interval_invariants.sql'")" = "1"
          test "$(docker exec ${{ job.services.postgres.id }} psql -U parkingops_test -d parkingops_test -Atc "select count(*) from schema_migrations where name='055_on_site_charges.sql'")" = "1"

      - name: Seed isolated integration database
        run: npm run seed --prefix backend

      - name: Backend syntax, units, PostgreSQL integrations, and security gates
        run: |
          npm run verify:launch --prefix backend
          npm run test:lifecycle --prefix backend
          npm run verify:cross-frontend --prefix backend

      - name: Customer tests and production build
        run: |
          npm run check --prefix frontend-customer
          npm test --prefix frontend-customer
          npm run verify:security-headers --prefix frontend-customer
          npm run build --prefix frontend-customer
          npm run verify:build --prefix frontend-customer

      - name: Admin tests, privacy checks, and production build
        run: |
          npm run verify:all --prefix frontend-admin
          npm run verify:browser --prefix frontend-admin

      - name: Reject malformed patches
        run: git diff --check

      - name: Complete CodeQL SAST
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          upload-database: false
          output: codeql-results

      - name: Reject CodeQL security findings
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const files = fs.readdirSync('codeql-results').filter(file => file.endsWith('.sarif'));
          const findings = files.flatMap(file => JSON.parse(fs.readFileSync(path.join('codeql-results', file), 'utf8')).runs
            .flatMap(run => (run.results || []).map(result => {
              const rule = (run.tool?.driver?.rules || []).find(item => item.id === result.ruleId) || {};
              return { result, securitySeverity: Number(rule.properties?.['security-severity'] || 0) };
            })));
          if (findings.length) {
            console.error(`CodeQL reported ${findings.length} security finding(s).`);
            for (const finding of findings) {
              const location = finding.result.locations?.[0]?.physicalLocation;
              console.error(`${finding.result.ruleId || 'unknown-rule'} severity=${finding.securitySeverity || 'unrated'} @ ${location?.artifactLocation?.uri || 'unknown-file'}:${location?.region?.startLine || '?'}`);
            }
          }
          const blocking = findings.filter(finding => finding.result.level === 'error' || finding.securitySeverity >= 8);
          if (blocking.length) {
            console.error(`CodeQL reported ${blocking.length} high/critical blocking finding(s).`);
            process.exit(1);
          }
          console.log('CodeQL reported zero high/critical security findings.');
          NODE
